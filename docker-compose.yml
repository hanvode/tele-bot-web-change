version: '3.8'

services:
  api-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-monitor
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID=
      - API_URL=https://www.msa.gov.cn/msacncms_wap//cmschannel/selectArticle/pageListById
      - CHECK_INTERVAL=60
    volumes:
      - ./logs:/app/logs